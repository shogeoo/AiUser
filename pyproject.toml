[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiuser"
version = "0.1.0"
description = "Autonomous AI agent that operates a real Telegram account through Telethon and an LLM via OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Georgiy" }]
keywords = ["telegram", "telethon", "llm", "agent", "openrouter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "telethon",
    "openai",
    "httpx",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/shogeoo/AiUser"
Repository = "https://github.com/shogeoo/AiUser"
Issues = "https://github.com/shogeoo/AiUser/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real Telegram and OpenRouter credentials (skipped by default)",
]
